<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seva AI - AI Powered Volunteer Platform for India</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap');
   
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0f172a 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .heading { font-family: 'Playfair Display', serif; }
    
    #map { 
      height: 280px; 
      border-radius: 20px; 
      width: 100%;
    }
    @media (min-width: 640px) { #map { height: 340px; } }
    @media (min-width: 1024px) { #map { height: 460px; } }

    .mandala-logo { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
    .mandala-logo:hover { transform: scale(1.08) rotate(4deg); }
    
    .glass {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.2);
    }
    
    .toast { animation: toastPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    @keyframes toastPop {
      from { transform: translateY(100px) scale(0.9); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .role-card {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .role-card.active {
      border-color: #fbbf24;
      background: rgba(251, 191, 36, 0.18);
      transform: scale(1.04);
    }
  </style>
</head>
<body class="min-h-screen text-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

    <!-- Header -->
    <header class="flex flex-col sm:flex-row justify-between items-center gap-6 mb-10">
      <div class="flex items-center gap-4">
        <img src="logo_transparent.png" alt="Seva AI" class="w-28 sm:w-36 md:w-44 h-20 sm:h-28 md:h-36 mandala-logo">
        <div>
          <h1 class="heading text-3xl sm:text-4xl lg:text-5xl font-bold tracking-tight text-amber-400">SEVA AI</h1>
          <p class="text-amber-300 text-sm sm:text-base">AI Powered Volunteer Platform for India</p>
        </div>
      </div>
      <div id="user-info" class="hidden flex items-center gap-3 bg-white/10 px-5 py-3 rounded-3xl text-sm">
        <span id="current-role" class="px-4 py-1 text-xs font-bold rounded-full bg-emerald-400 text-slate-900"></span>
        <span id="current-user" class="font-medium"></span>
        <button onclick="logout()" class="text-xs px-5 py-2 border border-white/30 rounded-2xl hover:bg-white/10">Logout</button>
      </div>
    </header>

    <!-- Login Modal -->
    <div id="auth-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
      <div class="glass rounded-3xl p-6 sm:p-10 w-full max-w-md">
        <div class="text-center mb-8">
          <h2 class="text-3xl font-bold text-amber-400">Welcome to Seva AI</h2>
          <p class="text-amber-300 mt-2">Join India's Seva Movement</p>
        </div>

        <div class="space-y-6">
          <div>
            <label class="block text-sm text-amber-300 mb-2">Full Name</label>
            <input id="name" type="text" placeholder="Enter your full name" class="w-full bg-white/10 border border-white/20 rounded-2xl px-5 py-4 focus:outline-none text-base">
          </div>

          <div>
            <label class="block text-sm text-amber-300 mb-2">Mobile Number <span class="text-red-400">*</span></label>
            <input id="mobile" type="tel" maxlength="10" placeholder="9876543210" class="w-full bg-white/10 border border-white/20 rounded-2xl px-5 py-4 focus:outline-none text-base">
          </div>

          <div>
            <label class="block text-sm text-amber-300 mb-2">Email (Optional)</label>
            <input id="email" type="email" placeholder="your@email.com" class="w-full bg-white/10 border border-white/20 rounded-2xl px-5 py-4 focus:outline-none text-base">
          </div>

          <div>
            <label class="block text-sm text-amber-300 mb-3">I am registering as</label>
            <div class="grid grid-cols-2 gap-4">
              <div onclick="selectRole(this)" data-role="volunteer" class="role-card active border-2 border-amber-400 bg-white/5 rounded-3xl p-5 text-center cursor-pointer">
                <div class="text-4xl mb-3">🙋‍♂️</div>
                <p class="font-semibold text-lg">Volunteer</p>
                <p class="text-xs text-amber-300">Seva Kartha</p>
              </div>
              <div onclick="selectRole(this)" data-role="ngo" class="role-card border-2 border-white/30 hover:border-amber-400 rounded-3xl p-5 text-center cursor-pointer">
                <div class="text-4xl mb-3">🏢</div>
                <p class="font-semibold text-lg">NGO Admin</p>
                <p class="text-xs text-amber-300">Organization</p>
              </div>
            </div>
          </div>

          <button onclick="handleAuth()" class="w-full bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold py-4 rounded-3xl text-lg transition-all">
            Join Seva AI
          </button>
        </div>
      </div>
    </div>

    <!-- Main Dashboard -->
    <div id="main-dashboard" class="hidden">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-10">
        <h2 class="heading text-3xl sm:text-4xl lg:text-5xl font-bold text-amber-300">Command Center • India</h2>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8">
        <div class="lg:col-span-12 grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4" id="stats-row"></div>

        <div class="lg:col-span-8">
          <div class="glass rounded-3xl p-5 md:p-8">
            <h3 class="heading text-2xl md:text-3xl font-semibold mb-6 text-amber-300">Live Needs Heatmap • India</h3>
            <div id="map" class="shadow-2xl"></div>
          </div>
        </div>

        <div class="lg:col-span-4 space-y-6">
          <div class="glass rounded-3xl p-5 md:p-8">
            <h3 class="text-xl font-semibold mb-5">📸 Gemini AI OCR</h3>
            <input type="file" id="ocr-upload" accept="image/*" class="hidden" onchange="simulateOCR(this)">
            <button onclick="document.getElementById('ocr-upload').click()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 py-5 rounded-3xl font-bold text-lg transition-all hover:scale-105">
              Upload Paper Survey
            </button>
          </div>

          <div class="glass rounded-3xl p-5 md:p-8">
            <h3 class="text-xl font-semibold mb-5">AI Insights</h3>
            <div id="insights-list" class="min-h-[180px]"></div>
            <div class="grid grid-cols-2 gap-4 mt-8">
              <button onclick="generateInsights('priority')" class="bg-amber-500 hover:bg-amber-600 py-4 rounded-3xl font-medium transition">Priority Analysis</button>
              <button onclick="generateInsights('allocation')" class="bg-emerald-600 hover:bg-emerald-700 py-4 rounded-3xl font-medium transition">Smart Allocation</button>
            </div>
          </div>
        </div>
      </div>

      <div class="mt-12">
        <h2 class="heading text-3xl font-semibold mb-6 text-amber-300">Recent Field Reports • India</h2>
        <div id="needs-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </div>

      <div class="mt-12">
        <h2 class="heading text-3xl font-semibold mb-6 text-amber-300">Smart Volunteer Matcher <span class="text-emerald-400 text-xl">🤖</span></h2>
        <div id="matcher-list" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-6 left-4 right-4 sm:left-auto sm:right-6 space-y-3 z-50"></div>

  <script>
    let needs = [];
    let assignments = [];
    let currentUser = null;
    let mapInstance = null;
    let markersLayer = null;
    let selectedRole = "volunteer";

    const sampleNeeds = [
      { id: 1, title: "Medical Aid & Medicines Required", area: "East Delhi Slums", lat: 28.65, lng: 77.25, urgency: "High", reports: 42, category: "Health", volunteersNeeded: 25 },
      { id: 2, title: "Flood Relief & Food Distribution", area: "Mumbai Suburbs (Dharavi)", lat: 19.05, lng: 72.85, urgency: "High", reports: 67, category: "Food", volunteersNeeded: 60 },
      { id: 3, title: "Shelter & Warm Clothes Needed", area: "Chennai (After Heavy Rains)", lat: 13.08, lng: 80.27, urgency: "High", reports: 31, category: "Shelter", volunteersNeeded: 40 },
      { id: 4, title: "Education Support for Children", area: "Hyderabad Old City", lat: 17.38, lng: 78.48, urgency: "Medium", reports: 18, category: "Education", volunteersNeeded: 22 },
      { id: 5, title: "Medical Camp Setup", area: "Kolkata (Howrah)", lat: 22.57, lng: 88.36, urgency: "High", reports: 29, category: "Health", volunteersNeeded: 35 },
      { id: 6, title: "Women Empowerment Workshop", area: "Jaipur (Pink City)", lat: 26.91, lng: 75.78, urgency: "Medium", reports: 14, category: "Community", volunteersNeeded: 15 },
      { id: 7, title: "Food & Nutrition for Underprivileged", area: "Pune Slums", lat: 18.52, lng: 73.85, urgency: "Medium", reports: 22, category: "Food", volunteersNeeded: 28 },
      { id: 8, title: "Cyclone Relief - Shelter & Food", area: "Lucknow (Uttar Pradesh)", lat: 26.85, lng: 80.95, urgency: "High", reports: 38, category: "Shelter", volunteersNeeded: 50 },
      { id: 9, title: "Clean Water & Sanitation Drive", area: "Ahmedabad (Gujarat)", lat: 23.02, lng: 72.57, urgency: "Medium", reports: 19, category: "Health", volunteersNeeded: 30 },
      { id: 10, title: "Elderly Care & Medical Help", area: "Bengaluru (Koramangala)", lat: 12.93, lng: 77.62, urgency: "Medium", reports: 12, category: "Health", volunteersNeeded: 18 }
    ];

    function calculatePriority(need) {
      let score = need.urgency === "High" ? 60 : 35;
      score += (need.reports || 0) * 1.8;
      return Math.min(99, Math.round(score));
    }

    function showToast(message, type = "info") {
      const toast = document.createElement('div');
      toast.className = `toast glass px-6 py-4 rounded-3xl border ${type === 'success' ? 'border-emerald-400' : 'border-amber-400'} text-white`;
      toast.innerHTML = message;
      document.getElementById('toast-container').appendChild(toast);
      setTimeout(() => toast.remove(), 4500);
    }

    function selectRole(element) {
      document.querySelectorAll('.role-card').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      selectedRole = element.getAttribute('data-role');
    }

    function handleAuth() {
      const name = document.getElementById('name').value.trim() || "Seva Kartha";
      const mobile = document.getElementById('mobile').value.trim();

      if (!mobile || mobile.length !== 10) {
        showToast("Please enter a valid 10-digit mobile number", "info");
        return;
      }

      const role = selectedRole === "ngo" ? "NGO Admin" : "Volunteer";
      currentUser = { name, mobile, role };

      document.getElementById('auth-modal').classList.add('hidden');
      document.getElementById('main-dashboard').classList.remove('hidden');
      document.getElementById('user-info').classList.remove('hidden');
      document.getElementById('current-user').textContent = name;
      document.getElementById('current-role').textContent = role;

      showToast(`Namaste, ${name}! Welcome to Seva AI`, "success");
      renderAll();
      
      // Fix for Leaflet map when shown after hidden element
      setTimeout(() => {
        if (mapInstance) mapInstance.invalidateSize();
      }, 300);
    }

    function logout() {
      currentUser = null;
      document.getElementById('user-info').classList.add('hidden');
      document.getElementById('main-dashboard').classList.add('hidden');
      document.getElementById('auth-modal').classList.remove('hidden');
    }

    window.acceptSeva = function(needId, btn) {
      const need = needs.find(n => n.id === needId);
      if (!need) return;

      assignments.push({id: needId});

      btn.innerHTML = `<span class="flex items-center justify-center gap-2"><span>✅</span> Assigned Successfully!</span>`;
      btn.disabled = true;
      btn.classList.add('!bg-emerald-500');

      const message = `🙏 *Seva AI Assignment Confirmed!*

*Need:* ${need.title}
*Location:* ${need.area}
*Category:* ${need.category}
*Urgency:* ${need.urgency}
*Priority:* ${calculatePriority(need)}%
*Volunteers Needed:* ${need.volunteersNeeded}

📍 *Reach here:* https://maps.google.com/?q=${need.lat},${need.lng}

Jai Hind! 🇮🇳`;

      setTimeout(() => window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank'), 800);

      showToast("✅ Assignment confirmed! WhatsApp details sent.", "success");
      renderAll();
    };

    function calculateMatchScore(need) {
      let score = 65;
      if (need.urgency === "High") score += 18;
      score += Math.min(15, need.reports * 0.4);
      score += Math.floor(Math.random() * 12) - 3;
      return Math.min(98, Math.max(72, Math.round(score)));
    }

    function renderSmartMatcher() {
      const container = document.getElementById('matcher-list');
      const isVolunteer = currentUser && currentUser.role === "Volunteer";

      container.innerHTML = needs.map(need => {
        const matchScore = calculateMatchScore(need);
        return `
          <div class="glass rounded-3xl p-6">
            <div class="flex justify-between items-start">
              <div class="flex-1">
                <p class="font-semibold text-lg">${need.title}</p>
                <p class="text-amber-300 mt-1 text-sm">${need.area}</p>
              </div>
              <div class="text-right ml-4">
                <div class="text-5xl font-bold ${matchScore > 90 ? 'text-emerald-400' : 'text-amber-400'}">${matchScore}%</div>
                <p class="text-xs text-emerald-300">AI Match</p>
              </div>
            </div>
            <div class="mt-6 grid grid-cols-2 gap-4 text-sm">
              <div><strong>Category:</strong> ${need.category}</div>
              <div><strong>Volunteers Needed:</strong> ${need.volunteersNeeded}</div>
            </div>
            ${isVolunteer ? `
              <button onclick="acceptSeva(${need.id}, this)" class="mt-8 w-full bg-gradient-to-r from-amber-400 to-yellow-400 text-slate-950 font-bold py-4 rounded-3xl hover:scale-105 transition">
                Accept This Seva & Get Details
              </button>` : `
              <div class="mt-8 text-center text-amber-300 text-sm py-4 bg-white/5 rounded-2xl">
                Only volunteers can accept assignments
              </div>`}
          </div>`;
      }).join('');
    }

    function simulateOCR(input) {
      if (!input.files.length) return;
      showToast("📸 Gemini AI is analyzing the document...", "info");
      input.value = '';
      setTimeout(() => {
        const newNeed = { id: Date.now(), title: "New Emergency Need Reported via OCR", area: "Local Area, India", urgency: "High", category: "Health", volunteersNeeded: 20, reports: 5, lat: 13 + Math.random()*5, lng: 80 + Math.random()*5 };
        needs.unshift(newNeed);
        renderAll();
        showToast("✅ New need added successfully!", "success");
      }, 1400);
    }

    function generateInsights(type) {
      const div = document.getElementById('insights-list');
      if (type === 'priority') {
        div.innerHTML = `<div class="p-6 bg-gradient-to-br from-amber-950 to-orange-950 rounded-3xl"><p class="text-amber-300 text-sm">National Priority</p><p class="text-white">Mumbai Flood Relief is currently the highest priority need in India.</p></div>`;
      } else {
        const total = needs.reduce((sum, n) => sum + n.volunteersNeeded, 0);
        const high = needs.filter(n => n.urgency === "High").length;
        div.innerHTML = `<div class="p-6 bg-gradient-to-br from-emerald-950 to-teal-950 rounded-3xl"><p class="text-emerald-300 text-sm">Smart Allocation</p><p class="text-white">Recommend allocating <strong>${Math.ceil(total*0.65)}</strong> volunteers across ${high} high-urgency zones.</p></div>`;
      }
      showToast("🤖 AI Insights Generated Successfully", "success");
    }

    function initMap() {
      mapInstance = L.map('map').setView([22.5, 78.0], 5);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(mapInstance);
      markersLayer = L.layerGroup().addTo(mapInstance);
      updateMapMarkers();
    }

    function updateMapMarkers() {
      if (!markersLayer) return;
      markersLayer.clearLayers();
      needs.forEach(need => {
        const color = need.urgency === "High" ? "#ef4444" : "#f59e0b";
        L.circleMarker([need.lat, need.lng], {
          radius: 13,
          fillColor: color,
          color: "#fff",
          weight: 3,
          fillOpacity: 0.85
        }).bindPopup(`<b>${need.title}</b><br>${need.area}<br>Priority: ${calculatePriority(need)}%`)
          .addTo(markersLayer);
      });
    }

    function renderAll() {
      const urgent = needs.filter(n => n.urgency === "High").length;
      document.getElementById('stats-row').innerHTML = `
        <div class="glass rounded-3xl p-5 text-center"><p class="text-amber-300 text-xs">Active Needs</p><p class="text-4xl font-bold">${needs.length}</p></div>
        <div class="glass rounded-3xl p-5 text-center"><p class="text-amber-300 text-xs">High Urgency</p><p class="text-4xl font-bold text-red-400">${urgent}</p></div>
        <div class="glass rounded-3xl p-5 text-center"><p class="text-amber-300 text-xs">Volunteers Assigned</p><p class="text-4xl font-bold text-emerald-400">${assignments.length}</p></div>
        <div class="glass rounded-3xl p-5 text-center"><p class="text-amber-300 text-xs">Avg Priority</p><p class="text-4xl font-bold text-amber-400">${needs.length ? Math.round(needs.reduce((a,n)=>a+calculatePriority(n),0)/needs.length) : 0}%</p></div>
      `;

      document.getElementById('needs-list').innerHTML = needs.map(n => `
        <div class="glass rounded-3xl p-6">
          <span class="px-4 py-1 text-xs rounded-full ${n.urgency==='High'?'bg-red-500/30 text-red-300':'bg-amber-500/30 text-amber-300'}">${n.urgency}</span>
          <p class="font-semibold text-xl mt-4">${n.title}</p>
          <p class="text-amber-300 mt-1">${n.area}</p>
          <div class="flex justify-between mt-6">
            <p class="text-emerald-400 text-sm">${calculatePriority(n)}% Priority</p>
            <p class="text-sm text-gray-400">${n.volunteersNeeded} volunteers needed</p>
          </div>
        </div>
      `).join('');

      updateMapMarkers();
      renderSmartMatcher();
    }

    window.onload = () => {
      needs = [...sampleNeeds];
      initMap();
      renderAll();
      document.getElementById('auth-modal').classList.remove('hidden');
      showToast("✅ Seva AI Loaded Successfully", "success");
    };
  </script>
</body>
</html>
